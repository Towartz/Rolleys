name: CI Multiplatform Test & Build

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------
  # Code Quality: Formatting and Clippy Lints
  # -------------------------------------------------------------
  code-quality:
    name: Code Quality (fmt & clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check generated C-ABI is up to date
        run: |
          python3 scripts/gen-cabi-parity.py
          rustfmt --edition 2021 bindings/baileys-cabi/src/parity.rs
          git diff --exit-code -- bindings/baileys-cabi/src/parity.rs bindings/c/baileys.h

  # -------------------------------------------------------------
  # Node binding: event mapping to Baileys names (no native build needed)
  # -------------------------------------------------------------
  napi-js-tests:
    name: Node binding event mapping
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        working-directory: bindings/baileys-napi
        run: npm test

  # -------------------------------------------------------------
  # Matrix Tests across Windows, Linux, and macOS Host Runners
  # -------------------------------------------------------------
  test-matrix:
    name: Test Workspace (${{ matrix.os }})
    needs: [code-quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build workspace binaries & libraries
        run: cargo build --workspace --release

  # -------------------------------------------------------------
  # Cross-Compilation Validation (Linux MUSL & Android ARM64)
  # -------------------------------------------------------------
  cross-validate:
    name: Cross-Build Validation (${{ matrix.target }})
    needs: [code-quality]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install prebuilt cross
        uses: taiki-e/install-action@cross

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}

      - name: Validate Cross-Build baileys-cli
        run: cross build -p baileys-cli --release --target ${{ matrix.target }}
